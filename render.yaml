services:
  - type: web
    name: dd-design-backend
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: dd-design-persistent-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DD_DATA_DIR
        value: /var/data
      - key: NETLIFY_SITE_ORIGIN
        value: https://jolly-raindrop-edc726.netlify.app
      - key: DD_NETLIFY_PROXY_SECRET
        sync: false
